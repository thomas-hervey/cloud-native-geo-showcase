name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  # The action lists PR commits to scan, which needs pull-requests: read.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v3.0.0. Personal-account repos need no GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckDB-Wasm Analytical SQL</title>
    <style>
        body { font-family: -apple-system, blinkmacsystemfont, "Segoe UI", roboto, helvetica, arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background: #f9fafb; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 24px; }
        h1 { color: #111827; margin-bottom: 8px; }
        p { color: #4b5563; margin-top: 0; }
        #sql-input { padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-family: monospace; font-size: 14px; width: 100%; box-sizing: border-box; margin-bottom: 12px; }
        #run-btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        #run-btn:hover { background: #1d4ed8; }
        #results { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        #results th, #results td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; }
        #results th { background: #f3f4f6; font-weight: 600; }
        .status { font-size: 12px; color: #6b7280; margin-top: 12px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; background: #e5e7eb; color: #374151; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card">
        <h1>DuckDB-Wasm: Local Analytics</h1>
        <p>This page runs a full SQL engine inside your browser. Powered by <strong>pnpm</strong> and <strong>Vite</strong>.</p>
        
        <div>
            <span id="engine-status" class="badge">Engine: Initializing...</span>
            <span id="data-status" class="badge">Data: Waiting...</span>
        </div>
    </div>

    <div class="card">
        <h3>Run a SQL Query</h3>
        <p>Try filtering by <strong>category</strong> or calculating <strong>AVG(score)</strong>.</p>
        <textarea id="sql-input">SELECT category, COUNT(*) as count, AVG(score) as avg_score 
FROM places 
GROUP BY category 
ORDER BY count DESC;</textarea>
        <button id="run-btn">Execute SQL</button>
        
        <div class="status" id="query-time">Ready to query.</div>
        
        <div style="overflow-x: auto;">
            <table id="results">
                <thead><tr id="table-header"></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script type="module" src="./main_analytical.js"></script>
</body>
</html>
